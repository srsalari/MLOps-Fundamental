# Session 10: Ansible settings for this folder (run ansible from inside deploy/).
[defaults]
inventory = inventory.ini
remote_user = ubuntu
private_key_file = ~/.ssh/mlops_vm
interpreter_python = /usr/bin/python3
stdout_callback = default
retry_files_enabled = False

[ssh_connection]
# Accept the VM's host key the first time, refuse it later if it changes.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
