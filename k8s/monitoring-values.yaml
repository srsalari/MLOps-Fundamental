# kube-prometheus-stack trimmed for 16GB laptops (session 13). ~1GB RAM total.
# Helm values: helm install monitoring prometheus-community/kube-prometheus-stack -f k8s/monitoring-values.yaml
# Components we do not need in a one-node kind lab are switched off to save memory.
alertmanager:
  # no alert routing in this course
  enabled: false
nodeExporter:
  # host-level metrics are not needed in kind
  enabled: false
defaultRules:
  # skip the large set of built-in alert rules
  create: false
# Control-plane components of kind are not scrapeable the usual way; disable their monitors.
kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy: {enabled: false}
prometheusOperator:
  admissionWebhooks:
    enabled: false        # avoids the cert-gen job image (offline friendly)
  tls:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
prometheus:
  prometheusSpec:
    # keep metrics for two days only
    retention: 2d
    # how often Prometheus reads metrics
    scrapeInterval: 15s
    # pick up ServiceMonitors/PodMonitors created by students in any namespace
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 100m, memory: 300Mi}
      limits: {memory: 800Mi}
grafana:
  adminPassword: mlops-lab   # LAB-ONLY
  # no built-in dashboards; students add their own
  defaultDashboardsEnabled: false
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}
  sidecar:
    dashboards:
      # a sidecar loads dashboards from labelled ConfigMaps
      enabled: true
      searchNamespace: ALL   # students ship dashboards as ConfigMaps with label grafana_dashboard=1
kube-state-metrics:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 192Mi}
