apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "churn-api.fullname" . }}
  labels:
    {{- include "churn-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "churn-api.selectorLabels" . | nindent 6 }}
  # Replace pods one by one; never go below the wanted number of ready pods.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "churn-api.selectorLabels" . | nindent 8 }}
      annotations:
        # A hash of the ConfigMap file. When the settings change, the hash changes,
        # the pod template changes, and Kubernetes starts new pods by itself.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        # The image runs as user app (uid 10001); Kubernetes needs the number to check it.
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "churn-api.fullname" . }}-config
          # Ready = the model is loaded (503 until then): no traffic before that.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          # Alive = the process answers; 3 failures in a row -> restart the container.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
